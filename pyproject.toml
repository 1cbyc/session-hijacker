[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-hijacker"
version = "0.1.0"
description = "Load browser cookies and tokens into httpx for authenticated API calls without a browser."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
]

[project.scripts]
session-hijacker = "session_hijacker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/session_hijacker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
